{% comment %}
Progress Stepper Component - COA/COB Multi-Section Forms
Story 2.2: Section I indicator (Sekcija 1 od 3)
{% endcomment %}

<div class="progress-stepper">
  <div class="stepper-step active" data-step="1">
    <div class="step-circle">1</div>
    <div class="step-label">Opšti podaci</div>
  </div>
  <div class="stepper-line"></div>
  <div class="stepper-step" data-step="2">
    <div class="step-circle">2</div>
    <div class="step-label">Podaci o projektu</div>
  </div>
  <div class="stepper-line"></div>
  <div class="stepper-step" data-step="3">
    <div class="step-circle">3</div>
    <div class="step-label">Dokumentacija</div>
  </div>
</div>

<div class="stepper-text">
  <strong>Sekcija 1 od 3</strong>
</div>
