{% load static %}
<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DOMOVIK - Prijava za Finansiranje{% endblock %}</title>

    <!-- Extra meta tags (CSRF, etc.) -->
    {% block extra_meta %}{% endblock %}

    <!-- Google Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Base CSS (includes @import for Google Fonts) -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    <!-- Page-specific CSS -->
    {% block extra_css %}{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}>
    <header role="banner">
        {% block header %}
        <!-- Header content will be filled by child templates -->
        {% endblock %}
    </header>

    <main role="main">
        {% block content %}
        <!-- Main content will be filled by child templates -->
        {% endblock %}
    </main>

    <footer role="contentinfo">
        {% block footer %}
        <!-- Footer content will be filled by child templates -->
        {% endblock %}
    </footer>

    <!-- Page-specific JavaScript -->
    {% block extra_js %}{% endblock %}
</body>
</html>
