server {
    listen 80;
    server_name 91.107.234.61;

    client_max_body_size 10M;

    # Static files
    location /static/ {
        alias /var/www/domovik/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Z9 (2026-07-25): NO `location /media/` here, deliberately.
    # Uploaded documents (budgets, CVs, letters of support) are personal data. Serving
    # them from nginx made every file world-readable to anyone holding the URL, which
    # contradicted the privacy policy. They are now reachable only through the
    # authenticated admin views in apps/submissions/views.py (download_file /
    # download_all_files, both @staff_member_required). Do not add this block back.

    # Proxy to Gunicorn
    location / {
        proxy_pass http://unix:/var/www/domovik/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
